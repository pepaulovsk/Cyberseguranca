<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curso de Cybersegurança — LP</title>

  <!-- Google Fonts (todos os pares do ThemePlayground; default = Par A) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=Archivo:wght@500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="sections.css" />

  <!-- ── :root canônico (UI-GUIDELINES §1) ─────────────────────────────── -->
  <style>
    :root {
      /* COLOR */
      --color-bg: #FAFAFA;
      --color-surface: #FFFFFF;
      --color-deep: #0A1628;
      --color-deep-2: #0F1F38;
      /* ── MBA Design System ──────────────────────────────────────────── */
      --mba-color: #0d3db2;
      --mba-color-hover: #08297b;
      --mba-font-primary: 'Poppins', system-ui, sans-serif;
      --mba-font-secondary: 'Roboto', system-ui, sans-serif;
      --mba-font-deco: 'Roboto', system-ui, sans-serif;
      /* tokens semânticos MBA (fundo branco) */
      --mba-color-heading:  #0A1628;
      --mba-color-body:     #2D3748;
      --mba-color-caption:  #5A6779;
      --mba-color-primary:  #0d3db2;
      /* tokens de cor MBA (grupo Cores) */
      --mba-color-bg:       #FAFAFA;
      --mba-color-surface:  #FFFFFF;

      /* ── Curso Design System ─────────────────────────────────────────── */
      --curso-color: #00CBC9;
      --curso-font-primary: 'Poppins', system-ui, sans-serif;
      --curso-font-secondary: 'Roboto', system-ui, sans-serif;
      --curso-font-deco: 'JetBrains Mono', ui-monospace, monospace;
      /* tokens semânticos Curso (fundo escuro) */
      --curso-color-heading:   #E6EEF8;
      --curso-color-body:      rgba(230, 238, 248, 0.80);
      --curso-color-caption:   rgba(230, 238, 248, 0.55);
      --curso-color-primary:   #00CBC9;
      /* tokens de cor Curso (grupo Cores) */
      --curso-color-bg:        #0F1F38;
      --curso-color-surface:   rgba(255, 255, 255, 0.06);
      --curso-color-hero:      #0A1628;
      --curso-color-secondary: #7C3AED;
      --curso-color-secondary-rgb: 124, 58, 237;

      /* ── Tokens resolvidos — DS ativo via cascade ────────────────────── */
      --ds-color-heading:   var(--mba-color-heading);
      --ds-color-body:      var(--mba-color-body);
      --ds-color-caption:   var(--mba-color-caption);
      --ds-color-primary:   var(--mba-color-primary);

      /* ── Token mapping — resolved via CSS cascade ────────────────────── */
      --color-primary: var(--curso-color);
      --color-brand: var(--mba-color);
      --color-brand-hover: var(--mba-color-hover);
      --color-accent: #7C3AED;
      --color-accent-ink: #5B21B6;
      --color-accent-soft: #A78BFA;
      --color-primary-ink: #058281;
      --color-text: #0A1628;
      --color-text-muted: #5A6779;
      --color-text-on-deep: #E6EEF8;
      --color-border: #E5E9F0;
      --color-border-deep: rgba(255, 255, 255, 0.08);

      /* TYPOGRAPHY — resolved via dual design system cascade */
      --font-heading: var(--mba-font-primary);
      --font-body: var(--mba-font-secondary);
      --font-ui: var(--mba-font-deco);

      /* Etapa 2: escala recalibrada para Poppins (humanista). Reduz teto
         de display/h1 — JetBrains Mono comportava 72px, Poppins fica
         cinematográfico nesse tamanho. Mantém hierarquia, baixa massa. */
      --fs-display: clamp(2.25rem, 4vw + 1rem, 3.75rem);
      --fs-h1: clamp(1.875rem, 2.5vw + 1rem, 2.5rem);
      --fs-h2: 1.75rem;
      --fs-h3: 1.375rem;
      --fs-h4: 1.125rem;
      --fs-body-lg: 1.125rem;
      --fs-body: 1rem;
      --fs-body-sm: 0.875rem;
      --fs-caption: 0.75rem;
      --fs-micro: 0.625rem;

      /* SPACING (grid 4/8) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-14: 56px;
      --space-16: 64px;
      --space-20: 80px;
      --space-24: 96px;
      --space-1-5: 6px;
      --space-2-5: 10px;
      --space-3-5: 14px;

      /* RADIUS */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --radius-2xl: 24px;

      /* MOTION */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --duration-fast: 150ms;
      --duration-base: 300ms;
      --duration-slow: 600ms;
      --duration-blink: 2.4s;

      /* LAYOUT */
      --container-max: 1280px;
      --container-padding: clamp(16px, 4vw, 48px);

      /* RGB CHANNELS — habilitam rgba(var(--color-*-rgb), alpha) em
         componentes que precisam de semi-transparência temática. Estes
         valores são mantidos em sincronia com as cores hex correspondentes
         via app.jsx (useEffect → setProperty). */
      --color-primary-rgb: 0, 203, 201;      /* #00CBC9 = --curso-color */
      --color-brand-rgb:   13, 61, 178;      /* #0d3db2 = --mba-color   */
      --color-accent-rgb:  124, 58, 237;     /* #7C3AED = --color-accent */
      --color-accent-soft-rgb: 167, 139, 250;/* #A78BFA = --color-accent-soft */
      --color-deep-rgb:    10, 22, 40;       /* #0A1628 = --color-deep  */

      /* MICRO UI SIZING */
      --size-icon-sm: 32px;
      --size-icon-md: 40px;
      --size-icon-lg: 48px;
      --size-avatar:  44px;
      --size-status-dot: 5px;

      /* MICRO UI TYPOGRAPHY */
      --fs-tiny: 8px;

      /* MICRO SPACING */
      --space-0-5: 2px;
    }

    /* ── reset enxuto ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    h1, h2, h3, h4 {
      font-family: var(--font-heading);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.005em;
      margin: 0;
      text-wrap: balance;
    }
    p { margin: 0; text-wrap: pretty; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ── squircle global onde a propriedade for suportada ──────────── */
    .card,
    .btn,
    .surface,
    .media,
    input,
    textarea,
    select {
      corner-shape: squircle;
    }

    /* ── container ─────────────────────────────────────────────────── */
    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding-left: var(--container-padding);
      padding-right: var(--container-padding);
    }

    /* ── seções deep ───────────────────────────────────────────────── */
    /* Etapa 1: removido o radial glow ciano/roxo dos cantos.
       Etapa 2: `.section-deep.alt` usa --color-deep-2 para diferenciar
       seções deep adjacentes (Hero deep + Mercado deep-alt criavam um
       bloco indistinto após Etapa 1). Diferenciação tonal mínima. */
    .section-deep,
    .hero {
      /* tokens DS Curso sobrepõem tokens MBA via cascade */
      --font-heading: var(--curso-font-primary);
      --font-body: var(--curso-font-secondary);
      --font-ui: var(--curso-font-deco);
      --ds-color-heading:  var(--curso-color-heading);
      --ds-color-body:     var(--curso-color-body);
      --ds-color-caption:  var(--curso-color-caption);
      --ds-color-primary:  var(--curso-color-primary);
      /* secondary controla tags roxas globalmente */
      --color-accent:      var(--curso-color-secondary);
      --color-accent-rgb:  var(--curso-color-secondary-rgb);
    }
    .section-deep {
      background: var(--curso-color-hero, var(--color-deep));
      color: var(--color-text-on-deep);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .section-deep.alt {
      background: var(--curso-color-bg, var(--color-deep-2));
    }
    .section-deep > * { position: relative; z-index: 1; }

    /* Etapa 2: gap entre seções reduzido de 96/96 para 80/80 desktop
       (96+96=192 era folga institucional-demais) e de 64/64 para 56/56
       em mobile. Cria respiro sem perder densidade. */
    section.lp-section {
      padding-top: var(--space-20);
      padding-bottom: var(--space-20);
    }
    @media (max-width: 768px) {
      section.lp-section {
        padding-top: var(--space-14);
        padding-bottom: var(--space-14);
      }
    }

    /* ── reveal-on-scroll ─────────────────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity var(--duration-slow) var(--ease-out),
        transform var(--duration-slow) var(--ease-out);
      will-change: opacity, transform;
    }
    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .reveal { opacity: 1; transform: none; }
    }

    /* ── eyebrow / kicker reutilizável ───────────────────────────────
     * DS MBA (default, seções claras): chip institucional — pill com
     *   bg/border tonais em brand blue + bolinha azul como marcador.
     *   Linguagem de "selo USP" (mesma família visual dos badges da hero).
     * DS Curso (.section-deep): kicker HUD — linha de 24px + caption
     *   uppercase mono, em cyan. Look de scanline técnica. */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1-5);
      padding: 5px 12px;
      font-family: var(--font-ui);
      font-size: var(--fs-micro);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-brand);
      background: rgba(var(--color-brand-rgb), 0.06);
      border: 1px solid rgba(var(--color-brand-rgb), 0.22);
      border-radius: 999px;
    }
    .eyebrow::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--color-brand);
      flex-shrink: 0;
    }
    /* em seções escuras: sabor do curso — restaura a linha + caption mono cyan */
    .section-deep .eyebrow {
      padding: 0;
      gap: var(--space-2);
      font-size: var(--fs-caption);
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--color-primary);
      background: transparent;
      border: 0;
      border-radius: 0;
    }
    .section-deep .eyebrow::before {
      width: 24px;
      height: 1px;
      border-radius: 0;
      background: currentColor;
    }

    /* ── .hud — classe dos ornamentos decorativos (aria-hidden) ────────
       Cor via --ds-color-caption; cascade garante contraste correto
       em seções claras (MBA) e escuras (Curso) automaticamente. */
    .hud {
      font-family: var(--font-ui);
      font-size: var(--fs-caption);
      letter-spacing: 0.04em;
      color: var(--ds-color-caption);
    }

    /* ── .ds-caption / .ds-caption-micro — tokens semânticos de legenda ─
       Usados em atribuições de fonte, metadados e micro-labels reais.
       Herdam --ds-color-caption que muda automaticamente por contexto DS. */
    .ds-caption {
      font-family: var(--font-ui);
      font-size: var(--fs-caption);
      letter-spacing: 0.04em;
      color: var(--ds-color-caption);
      line-height: 1.4;
    }
    .ds-caption-micro {
      font-family: var(--font-ui);
      font-size: var(--fs-micro);
      letter-spacing: 0.1em;
      color: var(--ds-color-caption);
      text-transform: uppercase;
    }

    /* ── focus ring ───────────────────────────────────────────────── */
    :focus-visible {
      outline: 2px solid var(--color-brand);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }
    .section-deep :focus-visible { outline-color: var(--color-primary); }

    /* ── selection ────────────────────────────────────────────────── */
    /* Etapa 1: selection default do browser. Era ciano sólido. */

    /* ── scrollbar discreta ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 999px;
    }
  </style>

  <!-- ── themeBoot inline (anti-flash) ───────────────────────────────── -->
  <script>
    (function() {
      function hexToRgbChannels(hex) {
        var h = String(hex).replace('#', '');
        if (h.length === 3) h = h.replace(/./g, function(c) { return c + c; });
        var n = parseInt(h.slice(0, 6), 16);
        if (isNaN(n)) return null;
        return ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255);
      }
      try {
        var stored = localStorage.getItem('cyber-lp-theme');
        if (!stored) {
          var params = new URLSearchParams(window.location.search);
          var fromUrl = params.get('theme');
          if (fromUrl && fromUrl !== '1') {
            try { stored = decodeURIComponent(escape(atob(fromUrl))); } catch(e) {}
          }
        }
        if (!stored) return;
        var theme = JSON.parse(stored);
        var root = document.documentElement;
        if (theme.bg)      root.style.setProperty('--color-bg', theme.bg);
        if (theme.surface) root.style.setProperty('--color-surface', theme.surface);
        if (theme.deep)    root.style.setProperty('--color-deep', theme.deep);
        if (theme.mbaColor) {
          root.style.setProperty('--mba-color', theme.mbaColor);
          var brandRgb = hexToRgbChannels(theme.mbaColor);
          if (brandRgb) root.style.setProperty('--color-brand-rgb', brandRgb);
        }
        var cursoColor = theme.cursoColor || theme.primary;
        if (cursoColor) {
          root.style.setProperty('--curso-color', cursoColor);
          var primaryRgb = hexToRgbChannels(cursoColor);
          if (primaryRgb) root.style.setProperty('--color-primary-rgb', primaryRgb);
        }
        if (theme.accent)  root.style.setProperty('--color-accent', theme.accent);
        if (theme.radiusLg) {
          var scale = theme.radiusLg / 14;
          root.style.setProperty('--radius-sm',  Math.round(6 * scale)  + 'px');
          root.style.setProperty('--radius-md',  Math.round(10 * scale) + 'px');
          root.style.setProperty('--radius-lg',  theme.radiusLg + 'px');
          root.style.setProperty('--radius-xl',  Math.round(18 * scale) + 'px');
          root.style.setProperty('--radius-2xl', Math.round(24 * scale) + 'px');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Order matters: store → icon library → primitives → backgrounds/hud/motion → tweaks → sections → app -->
  <script type="text/babel" src="theme-store.jsx"></script>
  <script type="text/babel" src="icon.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="hud.jsx"></script>
  <script type="text/babel" src="backgrounds.jsx"></script>
  <script type="text/babel" src="motion.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="alumni-ticker.jsx"></script>

  <script type="text/babel" src="app.jsx"></script>
</body>
